<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAILÉ — Admin Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#20252c;--panel:#2b3038;--panel2:#303741;--ink:#f5f8f8;--muted:#aebdc2;--line:#496671;--dew:#91B3BC;--rain:#5B7D87;--curr:#45415E;--slate:#2B4251;--good:#91b3bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#35454f 0,#20252c 42%);color:var(--ink);font-family:DM Sans,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px 24px}.login{max-width:440px;margin:10vh auto;background:rgba(43,48,56,.94);border:1px solid var(--line);padding:34px;border-radius:22px;box-shadow:0 25px 80px #0006}.brand{font:600 30px 'Playfair Display';letter-spacing:5px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dew);font-weight:700}.login h1{font:500 40px 'Playfair Display';margin:16px 0 8px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;background:#243540;border:1px solid var(--line);border-radius:10px;color:#fff;outline:none}.btn{padding:11px 15px;border:1px solid transparent;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:var(--dew);color:#1e2b30}.secondary{background:#253844;color:#fff;border-color:var(--rain)}.danger{background:#45415e;color:#fff;border-color:#6a617f}.app{display:none}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.top small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:linear-gradient(145deg,#303741,#282e36);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tab{background:#243540;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 15px;cursor:pointer}.tab.active{background:var(--dew);color:#203038}.panel{display:none}.panel.active{display:block}.card{background:rgba(43,48,56,.95);border:1px solid var(--line);border-radius:17px;padding:19px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.muted{color:var(--muted);font-size:13px}.status{padding:5px 9px;border-radius:99px;background:var(--curr);font-size:11px}.ordergrid{display:grid;grid-template-columns:1fr auto;gap:16px}.refs{display:flex;gap:8px;flex-wrap:wrap}.refs img{width:90px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product-card{background:#28323a;border:1px solid var(--line);border-radius:15px;overflow:hidden}.product-card .photo{height:210px;background:#243540;display:flex;align-items:center;justify-content:center}.product-card .photo img{width:100%;height:100%;object-fit:cover}.product-card .body{padding:14px}.product-card h3{margin:4px 0}.product-card input,.product-card select,.product-card textarea{width:100%;padding:9px;background:#22323d;border:1px solid var(--line);color:#fff;border-radius:8px;margin:4px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.uploadbox{border:1px dashed var(--rain);padding:16px;border-radius:12px;margin:12px 0;background:#25323a}.empty{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:#91b3bc;color:#1e2b30;padding:12px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}.section-title{margin:0 0 5px;font:500 30px 'Playfair Display'}
@media(max-width:950px){.stats{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.wrap{padding:18px 14px}.stats{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr}.ordergrid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body>
<div class="login" id="login"><div class="brand">NAILÉ</div><div class="eyebrow" style="margin-top:18px">Store management studio</div><h1>Admin Dashboard</h1><p class="muted">Kelola produk, foto, order dan custom request dari satu tempat.</p><div class="field"><label>ADMIN KEY</label><input id="key" type="password" placeholder="Masukkan admin key"></div><button class="btn primary" style="width:100%" onclick="enter()">Masuk ke Dashboard</button><p class="muted">Gunakan <b>ADMIN_KEY</b> dari file .env. Jangan gunakan default key saat production.</p></div>
<div class="app" id="app"><div class="wrap"><div class="top"><div><div class="brand">NAILÉ</div><small>Premium Store Management Studio</small></div><div class="actions"><button class="btn secondary" onclick="load()">Refresh</button><button class="btn secondary" onclick="location.href='/'">← Lihat Store</button></div></div>
<div class="stats"><div class="stat"><span class="muted">Total Orders</span><b id="sOrders">0</b></div><div class="stat"><span class="muted">Pending Payment</span><b id="sPending">0</b></div><div class="stat"><span class="muted">New Custom</span><b id="sCustom">0</b></div><div class="stat"><span class="muted">Paid Revenue</span><b id="sRevenue">Rp 0</b></div></div>
<div class="tabs"><button class="tab active" data-tab="orders">Orders</button><button class="tab" data-tab="custom">Custom Requests</button><button class="tab" data-tab="products">Products & Photos</button></div>
<section class="panel active" id="orders"></section><section class="panel" id="custom"></section><section class="panel" id="products"></section></div></div><div class="toast" id="toast"></div>
<script>
let key='';const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{}, {'x-admin-key':key});let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Request gagal');return d}function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function enter(){key=$('key').value.trim();try{await api('/api/admin/summary');$('login').style.display='none';$('app').style.display='block';await load()}catch(e){alert(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
async function load(){try{let s=await api('/api/admin/summary');$('sOrders').textContent=s.orders;$('sPending').textContent=s.pending;$('sCustom').textContent=s.custom;$('sRevenue').textContent=fmt(s.revenue);await renderOrders();await renderCustom();await renderProducts()}catch(e){alert(e.message)}}
async function renderOrders(){let rows=await api('/api/orders');$('orders').innerHTML=`<div class="card"><h2 class="section-title">Customer Orders</h2><p class="muted">Pantau pembayaran Midtrans dan proses order sampai selesai.</p></div>`+(rows.length?rows.map(o=>{let name=o.customer?.name||o.customer_name||'-',contact=o.customer?.contact||o.customer_contact||'-';let ps=o.paymentStatus||o.payment_status||'pending';return `<div class="card"><div class="ordergrid"><div><b>${esc(o.id)}</b><div class="muted">${o.createdAt||o.created_at?new Date(o.createdAt||o.created_at).toLocaleString('id-ID'):''}</div><p><b>${esc(name)}</b> · ${esc(contact)}</p><p>${esc(o.address||'-')}</p><div>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</div></div><div><span class="status">Payment: ${esc(ps)}</span><h3>${fmt(o.total)}</h3><select onchange="statusOrder('${o.id}',this.value)"><option ${o.status==='pending_payment'?'selected':''} value="pending_payment">Pending Payment</option><option ${o.status==='paid'?'selected':''} value="paid">Paid</option><option ${o.status==='production'?'selected':''} value="production">Production</option><option ${o.status==='shipped'?'selected':''} value="shipped">Shipped</option><option ${o.status==='completed'?'selected':''} value="completed">Completed</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">Cancelled</option></select></div></div></div>`}).join(''):'<div class="empty">Belum ada order.</div>')}
async function statusOrder(id,status){try{await api('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast('Status order diperbarui');await load()}catch(e){alert(e.message)}}
async function renderCustom(){let rows=await api('/api/custom-requests');$('custom').innerHTML=`<div class="card"><h2 class="section-title">Custom Nail Studio Requests</h2><p class="muted">Review referensi, ukuran kuku dan berikan status pengerjaan.</p></div>`+(rows.length?rows.map(o=>`<div class="card"><div class="row"><div><b>${esc(o.id)}</b><div class="muted">${new Date(o.createdAt||o.created_at).toLocaleString('id-ID')}</div></div><span class="status">${esc(o.status)}</span></div><p><b>${esc(o.name)}</b> · ${esc(o.contact)} · ${esc(o.shape)}</p><p>${esc(o.notes||'No notes')}</p><details><summary>Ukuran kuku</summary><pre>${esc(JSON.stringify(o.sizes,null,2))}</pre></details><div class="refs">${(o.references||[]).map(x=>`<img src="${esc(x)}" alt="reference">`).join('')}</div><div class="actions"><button class="btn secondary" onclick="customStatus('${o.id}','reviewing')">Reviewing</button><button class="btn primary" onclick="customStatus('${o.id}','quoted')">Mark Quoted</button><button class="btn secondary" onclick="customStatus('${o.id}','approved')">Approved</button><button class="btn danger" onclick="customStatus('${o.id}','completed')">Completed</button></div></div>`).join(''):'<div class="empty">Belum ada custom request.</div>')}
async function customStatus(id,status){try{await api('/api/custom-requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast('Custom request diperbarui');await load()}catch(e){alert(e.message)}}
async function uploadImage(input){if(!input.files[0])return '';const fd=new FormData();fd.append('image',input.files[0]);let r=await fetch('/api/products/upload-image',{method:'POST',headers:{'x-admin-key':key},body:fd});let d=await r.json();if(!r.ok)throw Error(d.error||'Upload gagal');return d.url}
async function addProduct(){try{let body={name:$('pn').value.trim(),price:Number($('pp').value),category:$('pc').value.trim()||'Soft',stock:Number($('ps').value)||0,emoji:$('pe').value||'💅🏻',imageUrl:$('pi').value.trim()||null,description:$('pd').value.trim()};if(!body.name)throw Error('Nama produk wajib');await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Produk ditambahkan');await renderProducts()}catch(e){alert(e.message)}}
async function saveProduct(id){try{let body={name:$('n_'+id).value,price:Number($('p_'+id).value),category:$('c_'+id).value,stock:Number($('s_'+id).value),imageUrl:$('i_'+id).value,description:$('d_'+id).value};await api('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('Produk disimpan');await renderProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('Hapus produk ini?'))return;try{await api('/api/products/'+id,{method:'DELETE'});toast('Produk dihapus');await renderProducts()}catch(e){alert(e.message)}}
async function productFileChanged(id,input){try{let url=await uploadImage(input);if(url){$('i_'+id).value=url;await saveProduct(id)}}catch(e){alert(e.message)}}
async function newImageChanged(input){try{let url=await uploadImage(input);$('pi').value=url;toast('Foto berhasil diupload')}catch(e){alert(e.message)}}
async function renderProducts(){let rows=await fetch('/api/products').then(r=>r.json());$('products').innerHTML=`<div class="card"><h2 class="section-title">Products & Photos</h2><p class="muted">Tambahkan produk baru, upload foto langsung, edit harga/stok, dan atur deskripsi tanpa membuka VS Code.</p><div class="uploadbox"><div class="eyebrow">New product</div><div class="field"><label>NAMA</label><input id="pn" placeholder="Contoh: Burgundy Velvet"></div><div class="actions"><input id="pp" type="number" placeholder="Harga"><input id="pc" placeholder="Kategori"><input id="ps" type="number" placeholder="Stok"><input id="pe" placeholder="Emoji" value="💅🏻"></div><div class="field"><label>FOTO</label><input id="newFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="newImageChanged(this)"><input id="pi" placeholder="atau URL /images/products/..." style="margin-top:7px"></div><div class="field"><label>DESKRIPSI</label><textarea id="pd" rows="2" placeholder="Deskripsi singkat produk"></textarea></div><button class="btn primary" onclick="addProduct()">+ Tambah Produk</button></div></div><div class="product-grid">${rows.map(p=>`<div class="product-card"><div class="photo">${(p.image_url||p.imageUrl||p.image)?`<img src="${esc(p.image_url||p.imageUrl||p.image)}" alt="${esc(p.name)}">`:'<span style="font-size:48px">'+(p.emoji||'💅🏻')+'</span>'}</div><div class="body"><input id="n_${p.id}" value="${esc(p.name)}"><input id="p_${p.id}" type="number" value="${Number(p.price)||0}"><div class="actions"><input id="c_${p.id}" value="${esc(p.category||'Soft')}" placeholder="Kategori"><input id="s_${p.id}" type="number" value="${Number(p.stock)||0}" placeholder="Stok"></div><input id="i_${p.id}" value="${esc(p.image_url||p.imageUrl||p.image||'')}" placeholder="URL foto"><input type="file" accept="image/jpeg,image/png,image/webp" onchange="productFileChanged('${p.id}',this)"><textarea id="d_${p.id}" rows="3" placeholder="Deskripsi">${esc(p.description||'')}</textarea><div class="actions"><button class="btn primary" onclick="saveProduct('${p.id}')">Simpan</button><button class="btn danger" onclick="deleteProduct('${p.id}')">Hapus</button></div></div></div>`).join('')}</div>`}
</script></body></html>
